<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap">
<link rel="stylesheet" href="ds/styles.css">
<script src="ds/ds-bundle.js"></script>
<style>
  :root { --font-heading: "Barlow Condensed", system-ui, sans-serif; --font-body: "Barlow", system-ui, sans-serif; }
  body { font-family: var(--font-body); }
  html { scroll-behavior: smooth; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-700); }
  .thumb { cursor: pointer; overflow: hidden; border-radius: 10px; position: relative; aspect-ratio: 1/1; border: 2px solid transparent; transition: border-color .2s ease, transform .3s ease; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .thumb:hover img { transform: scale(1.08); }
  .thumb.is-active { border-color: var(--color-accent); }
  .hero-cta { transition: transform .28s cubic-bezier(.34,1.4,.5,1), background-color .2s ease; }
  .hero-cta:hover { transform: scale(1.06); }
  .thumb::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--color-bg) 32%, transparent); transition: opacity .2s ease; }
  .thumb.is-active::after, .thumb:hover::after { opacity: 0; }
  @keyframes thumbIn { from { opacity: 0; transform: translateY(16px) scale(0.94); } to { opacity: 1; transform: none; } }
  .thumb { opacity: 0; animation: thumbIn .5s cubic-bezier(.22,1,.36,1) forwards; animation-delay: var(--d, 0s); }
  @media (max-width: 1024px) {
    .desktop-nav { display: none !important; }
    #g-burger { display: inline-flex !important; }
    .thumb-grid { grid-template-columns: repeat(6,1fr) !important; }
  }
  @media (max-width: 560px) { .thumb-grid { grid-template-columns: repeat(4,1fr) !important; } }
  .om-navlink:not(.nav-logo) { color: var(--color-highlight) !important; font-weight:600 !important; text-decoration: none; }
  .om-navlink.nav-logo { color: var(--color-text) !important; text-decoration: none; }
  .om-navlink:not(.nav-logo):hover { color: #fff !important; }
  .nav-underline { transition: transform .25s cubic-bezier(.34,1.4,.5,1); }
  .nav-underline::after { content:""; position:absolute; left:0; bottom:-5px; height:2px; width:100%; background:var(--color-accent); transform:scaleX(0); transform-origin:left; transition:transform .3s ease; }
  .nav-underline:hover { transform:scale(1.12); }
  .nav-underline:hover::after { transform:scaleX(1); }
  .hero-cta .cta-badge { transition: transform .32s cubic-bezier(.34,1.4,.5,1); transform-origin: center; }
  .hero-cta .cta-badge .cta-arrow { transition: opacity .18s ease; }
  .hero-cta:hover .cta-badge { transform: scale(0.26); }
  .hero-cta:hover .cta-badge .cta-arrow { opacity: 0; }
</style>

<script src="./support.js"></script>
</head>
<body>
<x-dc>


<div style="background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);min-height:100vh">

  <nav style="position:sticky;top:18px;z-index:20;max-width:1160px;margin:18px auto 0;display:flex;align-items:center;gap:24px;padding:10px 14px 10px 24px;background:linear-gradient(135deg, color-mix(in srgb, var(--color-bg) 30%, transparent), color-mix(in srgb, var(--color-bg) 12%, transparent));backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,0.45);border-radius:999px;box-shadow:0 8px 32px rgba(3,49,58,0.12), inset 0 1px 1px rgba(255,255,255,0.6), inset 0 -1px 1px rgba(255,255,255,0.12)">
    <a href="index.html" class="om-navlink" style="flex:1;display:flex;align-items:center;gap:12px;line-height:1;text-decoration:none">
      <img src="assets/logo.png" alt="Sreja MT — mašinska obrada metala" style="height:52px;width:auto;display:block;mix-blend-mode:multiply">
    </a>
    <div class="desktop-nav" style="display:contents">
    <a href="index.html#usluge" class="om-navlink nav-underline" style="font-size:17px;font-weight:500;margin:0 10px;position:relative;display:inline-block">Usluge</a>
    <a href="index.html#proces" class="om-navlink nav-underline" style="font-size:17px;font-weight:500;margin:0 10px;position:relative;display:inline-block">Proces</a>
    <a href="index.html#radovi" class="om-navlink nav-underline" style="font-size:17px;font-weight:500;margin:0 10px;position:relative;display:inline-block">Radovi</a>
    <a href="index.html#reference" class="om-navlink nav-underline" style="font-size:17px;font-weight:500;margin:0 10px;position:relative;display:inline-block">Reference</a>
    <div style="flex:1;display:flex;justify-content:flex-end">
    <a href="index.html#kontakt" class="hero-cta" style="text-decoration:none;display:inline-flex;align-items:center;gap:12px;font-family:var(--font-heading);font-weight:600;font-size:18px;padding:8px 8px 8px 24px;border-radius:999px;background:var(--color-highlight);color:var(--color-accent)">
      Zatražite ponudu
      <span class="cta-badge" style="display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--color-accent);color:#fff;flex:none">
        <svg class="cta-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </span>
    </a>
    </div>
    </div>
    <a href="index.html" id="g-burger" style="display:none;flex:none;text-decoration:none;align-items:center;gap:8px;height:46px;padding:0 20px;border:1px solid var(--color-divider);border-radius:999px;background:color-mix(in srgb, var(--color-bg) 70%, transparent);color:var(--color-accent);font-family:var(--font-heading);font-weight:600;font-size:15px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Početna
    </a>
  </nav>

  <header style="max-width:1200px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(20px,5vw,72px) clamp(20px,3vw,32px)">
    <span style="display:block;font-size:13px;line-height:12px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-accent-700);margin:0 0 12px">Galerija radova</span>
    <hr style="height:1px;border:0;margin:0 0 20px;background:var(--color-divider)">
    <h1 style="font-family:var(--font-heading);font-weight:600;font-size:clamp(36px,5.5vw,68px);line-height:1.02;letter-spacing:0.01em;text-transform:uppercase;margin:0;max-width:20ch">Delovi koji su izašli iz naše radionice</h1>
  </header>

  <section style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px) clamp(64px,8vw,110px)">
    <figure class="blueprint" style="margin:0 0 20px;padding:0;position:relative;aspect-ratio:16/9;background:var(--color-accent);overflow:hidden;border-radius:18px">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <img src="{{ activeSrc }}" alt="{{ activeLabel }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block">
      <span style="position:absolute;top:18px;right:22px;font-family:var(--font-heading);font-weight:600;font-size:14px;letter-spacing:0.08em;color:#fff;background:color-mix(in srgb, var(--color-accent) 70%, transparent);padding:6px 12px;border-radius:999px;backdrop-filter:blur(4px);pointer-events:none">{{ counter }}</span>
      <button aria-label="Prethodna" onClick="{{ prev }}" style="position:absolute;top:50%;left:clamp(10px,2vw,22px);transform:translateY(-50%);z-index:5;width:56px;height:56px;border-radius:50%;border:0;background:color-mix(in srgb, #fff 90%, transparent);color:var(--color-accent);box-shadow:0 6px 20px rgba(3,49,58,0.28);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button aria-label="Sledeća" onClick="{{ next }}" style="position:absolute;top:50%;right:clamp(10px,2vw,22px);transform:translateY(-50%);z-index:5;width:56px;height:56px;border-radius:50%;border:0;background:color-mix(in srgb, #fff 90%, transparent);color:var(--color-accent);box-shadow:0 6px 20px rgba(3,49,58,0.28);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </figure>

    <div class="thumb-grid" style="display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(6px,0.8vw,10px)">
      <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="14">
        <div class="{{ t.cls }}" onClick="{{ t.onClick }}" style="{{ t.delay }}">
          <img src="{{ t.src }}" alt="{{ t.label }}">
        </div>
      </sc-for>
    </div>
  </section>

  <footer style="max-width:1200px;margin:0 auto;padding:clamp(28px,4vw,48px) clamp(20px,5vw,72px);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;border-top:1px solid var(--color-divider)">
    <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none">
      <img src="assets/logo.png" alt="Sreja MT" style="height:56px;width:auto;display:block;mix-blend-mode:multiply">
    </a>
    <span style="font-size:13px;color:color-mix(in srgb, var(--color-text) 60%, transparent)">© 2010–2026 Sreja MT · Mašinska obrada metala · Valjevo</span>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { active: 0 };

  images() {
    return [
      { src: "assets/galerija-1.jpg", label: "Konusni zupčanik sa vratilom" },
      { src: "assets/galerija-2.jpg", label: "Lančanici sa dvostrukim vencem" },
      { src: "assets/galerija-3.jpg", label: "Ozubljena vratila — pinioni" },
      { src: "assets/galerija-4.jpg", label: "Kosozubi pužni vijci i zupčanik" },
      { src: "assets/galerija-5.jpg", label: "Veliki zupčasti venac sa prirubnicom" },
      { src: "assets/galerija-6.jpg", label: "Duboko bušenje na obradnom centru" },
      { src: "assets/galerija-7.jpg", label: "Navojne čaure sa prirubnicom" },
      { src: "assets/galerija-8.jpg", label: "Prirubnička ploča sa navojnim otvorom" },
      { src: "assets/galerija-9.jpg", label: "Kosozubi zupčanik i pužno vratilo" },
      { src: "assets/galerija-10.jpg", label: "Kućišta sa prirubnicom" },
      { src: "assets/galerija-11.jpg", label: "Vezne letve sa upuštenim otvorima" },
      { src: "assets/galerija-12.jpg", label: "Prsten sa zupcima — spojnica" },
      { src: "assets/galerija-13.jpg", label: "Vodilice sa bronzanim klizačima" },
      { src: "assets/galerija-14.jpg", label: "Profilne letve — glodane vodilice" },
      { src: "assets/galerija-15.jpg", label: "Ozubljena vratila u seriji" },
      { src: "assets/galerija-16.jpg", label: "Mesingane letve sa navojem i otvorima" },
      { src: "assets/galerija-17.jpg", label: "Alat za štancovanje sa oprugama" },
      { src: "assets/galerija-18.jpg", label: "Ležišne čaure u seriji" },
      { src: "assets/galerija-19.jpg", label: "Alat sa vodećim stubovima" },
      { src: "assets/galerija-20.jpg", label: "Zupčasti prstenovi — spojnice" },
      { src: "assets/galerija-21.jpg", label: "Alati za štancovanje — gornji i donji deo" },
      { src: "assets/galerija-22.jpg", label: "Prorezni alat sa umecima" },
      { src: "assets/galerija-23.jpg", label: "Veliki alat za štancovanje — sklop" },
      { src: "assets/galerija-24.jpg", label: "Alat sa vodećim stubovima na presi" },
      { src: "assets/galerija-25.jpg", label: "Stepenasta vratila — serija" },
      { src: "assets/galerija-26.jpg", label: "Segmenti zupčastog venca i pinion" },
      { src: "assets/galerija-27.jpg", label: "Alat sa kugličnim vođicama — detalj" },
      { src: "assets/galerija-28.jpg", label: "Matrica i žig alata za štancovanje" },
      { src: "assets/galerija-29.jpg", label: "Ploča alata sa prorezima i vođicama" },
      { src: "assets/galerija-30.jpg", label: "Serija ploča i probojaca alata" },
      { src: "assets/galerija-31.jpg", label: "Profilne ploče alata — par" },
      { src: "assets/galerija-32.jpg", label: "Alat sa vođicama — donja i gornja ploča" },
      { src: "assets/galerija-33.jpg", label: "Serija alata za štancovanje — spremno za isporuku" },
      { src: "assets/galerija-34.jpg", label: "Veliki alat sa vodenim hlađenjem" },
      { src: "assets/galerija-35.jpg", label: "Veliki zamajac sa ozubljenjem" },
      { src: "assets/galerija-36.jpg", label: "Kućište ležaja sa prirubnicom" },
      { src: "assets/galerija-37.jpg", label: "Velika glodana ploča kalupa" },
      { src: "assets/galerija-38.jpg", label: "Brušenje vratila na strugu" },
      { src: "assets/galerija-39.jpg", label: "Nosač ležaja sa čaurom" },
      { src: "assets/galerija-40.jpg", label: "Velika glodana ploča sa rebrima" },
      { src: "assets/galerija-41.jpg", label: "Vezne letve sa upuštenim otvorima — serija" },
      { src: "assets/galerija-42.jpg", label: "Prizme sa V-urezom" },
      { src: "assets/galerija-44.jpg", label: "Prirubnička ploča sa navojnim otvorima" },
      { src: "assets/galerija-45.jpg", label: "Mesingane letve sa navojem i upustima" }
    ];
  }

  go(i) {
    const n = this.images().length;
    this.setState({ active: ((i % n) + n) % n });
  }

  componentDidMount() {
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") this.go(this.state.active - 1);
      else if (e.key === "ArrowRight") this.go(this.state.active + 1);
    });
  }

  renderVals() {
    const imgs = this.images();
    const active = this.state.active;
    return {
      activeSrc: imgs[active].src,
      activeLabel: imgs[active].label,
      counter: (active + 1) + " / " + imgs.length,
      prev: () => this.go(active - 1),
      next: () => this.go(active + 1),
      thumbs: imgs.map((it, i) => ({
        ...it,
        cls: i === active ? "thumb is-active" : "thumb",
        delay: "--d:" + (i * 0.06).toFixed(2) + "s",
        onClick: () => this.go(i)
      }))
    };
  }
}
</script>
</body>
</html>
